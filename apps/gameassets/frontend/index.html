<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏素材工坊 · 团子衣橱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232851a3'/%3E%3Ctext x='16' y='23' font-size='16' text-anchor='middle' fill='white'%3E%E2%96%B6%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/web/style.css" />
<style>
  .idea-box { width: 100%; font-size: 15px; padding: 12px; border-radius: 10px;
              border: 1.5px solid var(--border, #ccc); resize: vertical; }
  .example-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .example-chips button { border: 1px dashed var(--border, #bbb); background: none; border-radius: 14px;
                          padding: 3px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted, #777); }
  .example-chips button:hover { border-color: var(--primary, #3b6ef5); color: var(--primary, #3b6ef5); }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .opt-grid .opt label { display: block; font-size: 12px; color: var(--muted, #888); margin-bottom: 4px; }
  .opt-grid select { width: 100%; }
  .scale-info { font-size: 12px; color: var(--muted, #888); margin-top: 4px; min-height: 16px; }

  .preset-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .preset-card { border: 1.5px solid var(--border, #ddd); border-radius: 8px; padding: 6px 4px 4px;
                 text-align: center; cursor: pointer; background: var(--bg, #fff); }
  .preset-card.active { border-color: var(--primary, #3b6ef5); box-shadow: 0 0 0 2px rgba(59,110,245,.15); }
  .preset-band { height: 12px; border-radius: 4px; margin-bottom: 4px; display: flex; overflow: hidden; }
  .preset-band i { flex: 1; }
  .preset-name { font-size: 12px; }

  .set-item { padding: 8px 10px; border: 1px solid var(--border, #e3e3e3); border-radius: 8px;
              margin-bottom: 6px; cursor: pointer; }
  .set-item.active { border-color: var(--primary, #3b6ef5); background: rgba(59,110,245,.05); }

  /* ===== 断线/中断横幅 ===== */
  #connBanner { display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px;
                background: #fdf0e2; border: 1.5px solid #e8b36a; color: #8a5300; font-size: 13.5px;
                align-items: center; gap: 10px; }
  #connBanner.show { display: flex; }
  #connBanner.danger { background: #fdeaea; border-color: #e08a8a; color: #a03030; }
  #connBanner button { margin-left: auto; }

  /* ===== 阶段卡片 ===== */
  .stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .stage-card { border: 1px solid var(--border, #e3e3e3); border-radius: 10px; padding: 9px 10px;
                background: var(--bg, #fff); display: flex; flex-direction: column; gap: 5px; }
  .stage-card.running { border-color: var(--primary, #3b6ef5); background: rgba(59,110,245,.05); }
  .stage-card.failed { border-color: #e08a8a; }
  .stage-head { display: flex; align-items: center; gap: 6px; }
  .stage-head b { font-size: 13px; }
  .stage-bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.08); overflow: hidden; }
  .stage-bar b { display: block; height: 100%; background: linear-gradient(90deg,#3b6ef5,#43c59e); transition: width .5s; }
  .stage-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted, #888); }
  .stage-meta .err { color: #c0392b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .stage-btn { align-self: flex-start; border: 1px solid var(--border, #ccc); background: none; border-radius: 7px;
               padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--primary, #3b6ef5); }
  .stage-btn:hover { background: rgba(59,110,245,.07); }
  .stage-btn:disabled { opacity: .45; cursor: default; }
  .st-chip { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; }
  .st-idle { background: rgba(0,0,0,.06); color: #888; }
  .st-queued { background: rgba(230,162,60,.15); color: #b26a00; }
  .st-running { background: rgba(59,110,245,.12); color: #3b6ef5; }
  .st-done { background: #e6f6ea; color: #1b7a34; }
  .st-failed { background: #fdeaea; color: #c0392b; }

  .status-chip { font-size: 11px; padding: 2px 10px; border-radius: 12px; }
  .status-running, .status-planning { background: rgba(59,110,245,.12); color: #3b6ef5; }
  .status-done { background: #e6f6ea; color: #1b7a34; }
  .status-partial { background: rgba(230,162,60,.15); color: #b26a00; }
  .status-done_with_errors, .status-failed { background: #fdf0e2; color: #b25e00; }

  /* ===== 操作日志 ===== */
  .log-box { border: 1px solid var(--border, #e3e3e3); border-radius: 10px; background: var(--bg, #fff);
             max-height: 180px; overflow: auto; padding: 8px 10px; font-size: 12.5px; }
  .log-line { display: flex; gap: 8px; padding: 1.5px 0; }
  .log-line .ts { color: var(--muted, #999); flex: none; font-family: monospace; font-size: 11.5px; }
  .log-line.warn { color: #b26a00; }
  .log-line.error { color: #c0392b; }

  .plan-box { border-left: 3px solid var(--primary, #3b6ef5); padding: 6px 12px; margin-bottom: 10px;
              background: rgba(59,110,245,.04); border-radius: 0 8px 8px 0; font-size: 13px; }

  .section-title { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .asset-card { border: 1px solid var(--border, #e3e3e3); border-radius: 10px; overflow: hidden;
                background: var(--bg, #fff); position: relative; }
  .asset-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f4f4f4; }
  .asset-card.master img { aspect-ratio: 16/9; }
  .asset-body { padding: 8px 10px 10px; }
  .tone-badge { display: inline-flex; font-size: 12px; padding: 2px 8px; border-radius: 20px; }
  .tone-pass { background: #e6f6ea; color: #1b7a34; }
  .tone-fail { background: #fdf0e2; color: #b25e00; }
  .kind-chip { font-size: 11px; padding: 1px 8px; border-radius: 12px; background: rgba(59,110,245,.1); color: var(--primary, #3b6ef5); }
  .tier-chip { font-size: 11px; padding: 1px 8px; border-radius: 12px; color: #fff; }
  .tier-common { background: #909399; } .tier-fine { background: #4a90d9; }
  .tier-epic { background: #8e44ad; } .tier-legendary { background: #e67e22; }
  .season-chip { font-size: 11px; padding: 1px 7px; border-radius: 12px; background: rgba(67,197,158,.15); color: #1b7a5a; }
  .master-palette { display: flex; gap: 4px; }
  .master-palette i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); }
  .card-actions { position: absolute; top: 6px; right: 6px; }
  .card-actions button { border: none; border-radius: 6px; padding: 3px 8px; font-size: 11.5px; cursor: pointer;
                         background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🎮</span>
    <div>
      <h1>游戏素材工坊</h1>
      <p class="sub">一句话 → 自动策划 → 分类生成整套素材（每类独立出图、独立重试）</p>
    </div>
  </div>
  <nav class="mainnav">
    <a class="navitem" href="/" title="返回工作台">← 工作台</a>
  </nav>
</header>

<main class="layout">
  <!-- ==================== 左侧：一句话 ==================== -->
  <aside class="panel">
    <section class="field">
      <div class="field-head"><label>描述你想要的游戏世界</label></div>
      <textarea id="idea" class="idea-box" rows="3"
        placeholder="例：一个东方修仙题材的开放世界，剑修与灵兽相伴"></textarea>
      <div class="example-chips">
        <button data-i="东方修仙题材的开放世界，剑修与灵兽相伴">东方修仙</button>
        <button data-i="蒸汽朋克飞空艇城市的冒险故事">蒸汽朋克</button>
        <button data-i="北欧神话风格的维京村落与冰海">北欧维京</button>
        <button data-i="萌系 Q 版农场经营小镇">萌系农场</button>
      </div>

      <p class="hint" style="margin-top:10px">美术风格</p>
      <div class="preset-cards" id="styleCards"></div>

      <p class="hint" style="margin-top:10px">时间背景（色调与光照锚点）</p>
      <div class="preset-cards" id="timeCards"></div>

      <div class="opt-grid">
        <div class="opt"><label>规模</label>
          <select id="scale"></select></div>
        <div class="opt"><label>风格补充</label>
          <select id="descPreset">
            <option value="">（不补充）</option>
            <option value="低饱和莫兰迪配色">莫兰迪</option>
            <option value="高饱和明快配色">明快</option>
            <option value="暗调电影感">电影感</option>
          </select></div>
        <div class="opt"><label>&nbsp;</label>
          <button id="btnGen" class="btn btn-primary" style="width:100%">生成素材包</button></div>
      </div>
      <p class="scale-info" id="scaleInfo"></p>
      <p class="hint">系统自动策划角色/宠物/武器（分等级）/建筑/野怪；场景自动出春夏秋冬四季。每类素材独立生成、独立重试，一类失败不影响其他类。</p>
    </section>

    <section class="field">
      <div class="field-head"><label>我的项目</label></div>
      <div id="setList"><p class="muted">还没有项目</p></div>
    </section>
  </aside>

  <!-- ==================== 右侧：进度 / 结果 ==================== -->
  <section class="content">
    <div class="empty" id="empty">
      <div class="empty-icon">🎮</div>
      <p>写一句话，系统自动策划并生成整套游戏素材</p>
      <p class="muted">策划 → 基准图 → 场景×四季 / 角色 / 宠物 / 武器 / 建筑 / 野怪（各类独立）</p>
    </div>

    <div id="detail" style="display:none">
      <div id="connBanner">
        <span id="connMsg"></span>
        <button class="btn btn-ghost" onclick="location.reload()">刷新页面</button>
      </div>

      <div class="toolbar" style="margin-bottom:10px">
        <b id="dName" style="font-size:16px"></b>
        <span class="kind-chip" id="dStyle"></span>
        <span class="kind-chip" id="dTime"></span>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="btnRunAll">全部生成</button>
        <button class="btn btn-danger" id="btnDelSet">删除</button>
      </div>

      <div class="stage-grid" id="stageGrid"></div>

      <p class="section-title" style="margin-top:14px">操作日志</p>
      <div class="log-box" id="logBox"><span class="muted">暂无日志</span></div>

      <div id="planArea"></div>
      <div id="masterArea"></div>
      <div id="resultArea"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { styles: [], times: [], scales: [], sets: [], current: null,
                  timer: null, failCount: 0, stages: [] };

  const STAGE_TIP = {
    plan: '一句话 → 完整设定（各类数量与描述）',
    master: '全集色调锚点，其他素材都融合它',
    scene: '每个场景自动出春夏秋冬',
    character: '全身立绘 · 干净底色可抠图',
    pet: '宠物伙伴设计',
    weapon: '按 普通/精良/史诗/传说 分级',
    building: '建筑外观设定',
    monster: '野怪设计',
  };

  // ================= 启动 =================
  (async () => {
    const [pr, st] = await Promise.all([
      fetch('/api/v1/gameassets/presets').then(r => r.json()),
      fetch('/api/v1/gameassets/sets').then(r => r.json()),
    ]);
    state.styles = pr.styles; state.times = pr.times; state.scales = pr.scales;
    state.stages = pr.stages || [];
    state.sets = st.items;
    renderCards($('styleCards'), state.styles);
    renderCards($('timeCards'), state.times, 2);       // 默认黄昏
    renderScales();
    renderSetList();
  })();

  function renderCards(box, items, activeIdx = 0) {
    box.innerHTML = '';
    items.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'preset-card' + (i === activeIdx ? ' active' : '');
      el.dataset.id = p.id;
      el.innerHTML = '<div class="preset-band">' +
        (p.swatch || []).map(c => '<i style="background:' + c + '"></i>').join('') +
        '</div><span class="preset-name">' + p.name + '</span>';
      el.addEventListener('click', () => {
        box.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
      });
      box.appendChild(el);
    });
  }
  const activeId = (box) => box.querySelector('.preset-card.active')?.dataset.id;

  function renderScales() {
    const sel = $('scale');
    sel.innerHTML = state.scales.map(s =>
      `<option value="${s.id}">${s.name}（约 ${s.images} 张）</option>`).join('');
    updateScaleInfo();
    sel.addEventListener('change', updateScaleInfo);
  }
  function updateScaleInfo() {
    const s = state.scales.find(x => x.id === $('scale').value);
    if (s) $('scaleInfo').textContent =
      `场景 ${s.scenes}×4季 · 角色 ${s.characters} · 宠物 ${s.pets} · 武器 ${s.weapons}（分等级） · 建筑 ${s.buildings} · 野怪 ${s.monsters}`;
  }

  document.querySelectorAll('.example-chips button').forEach(b =>
    b.addEventListener('click', () => { $('idea').value = b.dataset.i; }));

  // ================= 一键生成 =================
  $('btnGen').addEventListener('click', async () => {
    const idea = $('idea').value.trim();
    if (!idea) return toast('先写一句话描述你的游戏世界');
    busy($('btnGen'), true, '创建中…');
    try {
      const res = await fetch('/api/v1/gameassets/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idea, style: activeId($('styleCards')), time_preset: activeId($('timeCards')),
          scale: $('scale').value, desc: $('descPreset').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail?.message || 'HTTP ' + res.status);
      $('idea').value = '';
      await refreshSets();
      selectSet(data.id);
    } catch (e) { toast('启动失败：' + e.message); }
    finally { busy($('btnGen'), false); }
  });

  // ================= 项目列表 =================
  async function refreshSets() {
    try {
      const st = await fetch('/api/v1/gameassets/sets').then(r => r.json());
      state.sets = st.items;
      renderSetList();
    } catch (e) { /* 列表刷新失败不弹窗，详情轮询会提示断线 */ }
  }

  const STATUS_TEXT = { idle: '未开始', partial: '部分完成', running: '生成中',
                        done: '已完成', done_with_errors: '部分失败', failed: '失败' };

  function renderSetList() {
    const box = $('setList');
    if (!state.sets.length) { box.innerHTML = '<p class="muted">还没有项目</p>'; return; }
    box.innerHTML = '';
    state.sets.forEach(s => {
      const el = document.createElement('div');
      el.className = 'set-item' + (s.id === state.current ? ' active' : '');
      el.innerHTML = `<b>${esc(s.name)}</b>
        <span class="status-chip status-${s.status}" style="margin-left:6px">${STATUS_TEXT[s.status] || s.status}</span>
        <div class="muted" style="font-size:11.5px;margin-top:2px">${s.asset_count} 张素材</div>`;
      el.addEventListener('click', () => selectSet(s.id));
      box.appendChild(el);
    });
  }

  function selectSet(sid) {
    state.current = sid;
    $('empty').style.display = 'none';
    $('detail').style.display = '';
    renderSetList();
    poll(true);
    clearInterval(state.timer);
    state.timer = setInterval(poll, 2000);
  }

  // ================= 轮询 + 断线检测 =================
  function showBanner(msg, danger) {
    $('connMsg').textContent = msg;
    $('connBanner').classList.add('show');
    $('connBanner').classList.toggle('danger', !!danger);
  }
  function hideBanner() { $('connBanner').classList.remove('show', 'danger'); }

  async function poll(first = false) {
    if (!state.current) return;
    try {
      const r = await fetch(`/api/v1/gameassets/sets/${state.current}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const s = await r.json();
      state.failCount = 0;
      hideBanner();
      renderDetail(s);
    } catch (e) {
      state.failCount++;
      if (state.failCount >= 3) {
        showBanner('⚠ 与服务失去连接——进度可能已中断。恢复后可对失败/中断的类别单独点「生成」续做。', true);
        stopSpinners();          // 别再让进度条假装在跑
      }
    }
  }

  function stopSpinners() {
    document.querySelectorAll('.stage-card.running').forEach(el => {
      el.classList.remove('running');
      const chip = el.querySelector('.st-chip');
      if (chip && (chip.textContent === '执行中' || chip.textContent === '排队中')) {
        chip.textContent = '已中断'; chip.className = 'st-chip st-failed';
      }
      const bar = el.querySelector('.stage-bar b');
      if (bar) bar.style.transition = 'none';
    });
  }

  // ================= 详情渲染 =================
  const ST_ORDER = ['plan', 'master', 'scene', 'character', 'pet', 'weapon', 'building', 'monster'];
  const ST_NAME = { plan: '自动策划', master: '基准图', scene: '场景×四季', character: '角色',
                    pet: '宠物', weapon: '武器', building: '建筑', monster: '野怪' };
  const ST_CHIP = { idle: ['待生成', 'st-idle'], queued: ['排队中', 'st-queued'],
                    running: ['执行中', 'st-running'], done: ['完成', 'st-done'],
                    failed: ['失败', 'st-failed'] };

  function renderDetail(s) {
    $('dName').textContent = s.name;
    $('dStyle').textContent = s.style_name || '';
    $('dTime').textContent = s.time_name || '';

    // alive 对账：页面显示在跑，但服务端没有任务 → 明确告知中断，不再空转
    const stages = s.pipeline?.stages || {};
    const anyActive = ST_ORDER.some(k => ['queued', 'running'].includes(stages[k]?.status));
    if (anyActive && !s.alive) {
      showBanner('⚠ 流水线已中断（服务重启或异常退出）。下面标黄的类别点「生成」即可续做，已完成的不受影响。', true);
      ST_ORDER.forEach(k => { if (['queued', 'running'].includes(stages[k]?.status)) {
        stages[k].status = 'failed';
        stages[k].error = stages[k].error || '任务中断';
      }});
    }

    renderStages(s, stages);
    renderLog(s.pipeline?.log || []);
    renderPlan(s);
    renderMaster(s);
    renderResults(s);
  }

  function renderStages(s, stages) {
    const grid = $('stageGrid');
    if (!grid.children.length) grid.innerHTML = ST_ORDER.map(k => `
      <div class="stage-card" data-k="${k}">
        <div class="stage-head"><b>${ST_NAME[k]}</b><span class="st-chip st-idle">待生成</span></div>
        <div class="stage-bar"><b style="width:0%"></b></div>
        <div class="stage-meta"><span class="cnt"></span><span class="err"></span></div>
        <div class="stage-meta" style="font-size:11px">${STAGE_TIP[k] || ''}</div>
        <button class="stage-btn">生成</button>
      </div>`).join('');
    ST_ORDER.forEach(k => {
      const el = grid.querySelector(`[data-k="${k}"]`);
      const st = stages[k] || { status: 'idle', done: 0, total: 0, error: '' };
      const [chipText, chipCls] = ST_CHIP[st.status] || ST_CHIP.idle;
      el.querySelector('.st-chip').textContent = chipText;
      el.querySelector('.st-chip').className = 'st-chip ' + chipCls;
      el.classList.toggle('running', st.status === 'running' || st.status === 'queued');
      el.classList.toggle('failed', st.status === 'failed');
      el.querySelector('.stage-bar b').style.width =
        st.total ? (st.done / st.total * 100) + '%' : (st.status === 'done' ? '100%' : '0%');
      el.querySelector('.cnt').textContent = st.total ? `${st.done}/${st.total}` : '';
      el.querySelector('.err').textContent = st.error || '';
      const btn = el.querySelector('.stage-btn');
      const active = ['queued', 'running'].includes(st.status);
      btn.disabled = active;
      btn.textContent = active ? '进行中…' : (st.status === 'failed' ? '重试'
                         : (st.status === 'done' ? '重新生成' : '生成'));
      btn.onclick = () => runStage(k, btn);
    });
  }

  async function runStage(kind, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(`/api/v1/gameassets/sets/${state.current}/stages/${kind}/run`, { method: 'POST' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.message || 'HTTP ' + r.status);
      toast(kind === 'all' ? '已加入队列：策划 → 基准图 → 各类素材' : `「${ST_NAME[kind]}」已加入队列`);
      poll(true);
    } catch (e) { toast(e.message); btn.disabled = false; }
  }
  $('btnRunAll').addEventListener('click', (e) => runStage('all', e.target));

  function renderLog(log) {
    const box = $('logBox');
    if (!log.length) { box.innerHTML = '<span class="muted">暂无日志</span>'; return; }
    box.innerHTML = log.slice(-60).map(l =>
      `<div class="log-line ${l.level}"><span class="ts">${l.ts}</span><span>${esc(l.msg)}</span></div>`).join('');
    box.scrollTop = box.scrollHeight;
  }

  function renderPlan(s) {
    const box = $('planArea');
    const plan = s.plan;
    if (!plan) { box.innerHTML = ''; return; }
    const counts = [['场景', plan.scenes], ['角色', plan.characters], ['宠物', plan.pets],
                    ['武器', plan.weapons], ['建筑', plan.buildings], ['野怪', plan.monsters]];
    box.innerHTML = `<p class="section-title">策划方案 <span class="kind-chip">${plan.planner === 'llm' ? 'LLM 策划' : '规则模板'}</span></p>
      <div class="plan-box"><b>${esc(plan.title)}</b><span class="muted" style="font-size:12px">（${esc(plan.scale_name)}）</span>
      <div class="muted" style="font-size:12.5px;margin-top:2px">${esc(plan.synopsis)}</div>
      <div class="muted" style="font-size:12px;margin-top:4px">${counts.map(([n, l]) => `${n}×${l.length}`).join(' · ')}</div></div>`;
  }

  function renderMaster(s) {
    const box = $('masterArea');
    if (!s.master) { box.innerHTML = ''; return; }
    box.innerHTML = `<p class="section-title">基准图 <span class="muted" style="font-weight:400;font-size:12px">全集色调锚点</span></p>
      <div class="asset-grid"><div class="asset-card master">
        <img src="${s.master.url}" loading="lazy">
        <div class="asset-body">
          <div class="master-palette">${(s.master.palette || []).map(c => `<i style="background:${c}"></i>`).join('')}</div>
        </div>
      </div></div>`;
  }

  function renderResults(s) {
    const box = $('resultArea');
    const groups = {};
    (s.assets || []).forEach(a => (groups[a.kind] = groups[a.kind] || []).push(a));
    const order = ['scene', 'character', 'pet', 'weapon', 'building', 'monster'];
    const names = { scene: '场景', character: '角色', pet: '宠物', weapon: '武器',
                    building: '建筑', monster: '野怪' };
    let html = '';
    for (const k of order) {
      const list = groups[k];
      if (!list || !list.length) continue;
      html += `<p class="section-title">${names[k]} <span class="muted" style="font-weight:400;font-size:12px">${list.length} 张 · 可单卡重跑</span></p>
        <div class="asset-grid">` + list.map(a => {
        const tone = a.tone || {};
        return `<div class="asset-card">
          <img src="${a.url}" loading="lazy">
          <div class="card-actions"><button onclick="window.__rerun('${a.id}')">↻</button></div>
          <div class="asset-body">
            <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
              <b style="font-size:13px">${esc(a.name)}</b>
              ${a.season_name ? `<span class="season-chip">${a.season_name}</span>` : ''}
              ${a.tier ? `<span class="tier-chip tier-${a.tier_id}">${a.tier}</span>` : ''}
            </div>
            <div style="margin-top:4px">
              <span class="tone-badge ${tone.pass ? 'tone-pass' : 'tone-fail'}">
                ${tone.pass ? '✓ 色调一致' : '⚠ 色调偏离'} ${Math.round(tone.score)}
              </span>
            </div>
            <div class="tone-swatches">${(tone.palette || []).map(c => `<i style="background:${c}"></i>`).join('')}</div>
          </div>
        </div>`;
      }).join('') + '</div>';
    }
    box.innerHTML = html || '';
  }

  window.__rerun = async (aid) => {
    try {
      const r = await fetch(`/api/v1/gameassets/sets/${state.current}/assets/${aid}/rerun`, { method: 'POST' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.message || 'HTTP ' + r.status);
      toast('重跑完成');
      poll(true);
    } catch (e) { toast('重跑失败：' + e.message); }
  };

  $('btnDelSet').addEventListener('click', async () => {
    if (!confirm('删除这个项目和它的全部素材？')) return;
    try {
      const r = await fetch(`/api/v1/gameassets/sets/${state.current}`, { method: 'DELETE' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.message || 'HTTP ' + r.status);
      state.current = null;
      clearInterval(state.timer);
      $('detail').style.display = 'none';
      $('empty').style.display = '';
      refreshSets();
    } catch (e) { toast(e.message); }
  });

  // ================= 工具 =================
  function esc(x) {
    return String(x ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 3200);
  }
  function busy(btn, on, text) {
    if (on) { btn.dataset.old = btn.textContent; btn.textContent = text || '处理中…'; btn.disabled = true; }
    else { btn.textContent = btn.dataset.old || btn.textContent; btn.disabled = false; }
  }
})();
</script>
</body>
</html>
